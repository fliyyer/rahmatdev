name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run build
        run: echo "Build Success"

      - name: Send Discord Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"🚀 New push to main by ${{ github.actor }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
